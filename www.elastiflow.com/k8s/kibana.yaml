apiVersion: apps/v1
kind: Deployment
metadata:
  name: elastiflow-kibana
  labels:
    app.kubernetes.io/name: elastiflow-kibana
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: elastiflow-kibana
  template:
    metadata:
      labels:
        app.kubernetes.io/name: elastiflow-kibana
    spec:
      containers:
        - name: elastiflow-kibana
          image: elastic/kibana:9.2.1
          env:
            - name: SERVER_HOST
              value: 0.0.0.0
            - name: SERVER_PORT
              value: "5601"
            - name: SERVER_MAXPAYLOADBYTES
              value: "8388608"
            - name: ELASTICSEARCH_HOSTS
              value: http://elastiflow-elasticsearch:9200
            - name: ELASTICSEARCH_REQUESTTIMEOUT
              value: "132000"
            - name: ELASTICSEARCH_SHARDTIMEOUT
              value: "120000"
            - name: KIBANA_DEFAULTAPPID
              value: dashboard/653cf1e0-2fd2-11e7-99ed-49759aed30f5
            - name: KIBANA_AUTOCOMPLETETIMEOUT
              value: "3000"
            - name: KIBANA_AUTOCOMPLETETERMINATEAFTER
              value: "2500000"
            - name: LOGGING_DEST
              value: stdout
            - name: LOGGING_QUIET
              value: "false"
          ports:
            - name: http
              containerPort: 5601
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /api/status
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 30
---
apiVersion: v1
kind: Service
metadata:
  name: elastiflow-kibana
  labels:
    app.kubernetes.io/name: elastiflow-kibana
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  selector:
    app.kubernetes.io/name: elastiflow-kibana
  ports:
    - name: http
      port: 5601
      targetPort: http
      protocol: TCP
