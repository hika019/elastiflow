# 外部ルーターからの NetFlow / sFlow / IPFIX を NodePort (<NodeIP>:32055,32343,32739/udp) で受ける。
# externalTrafficPolicy: Local にしているのは、SNAT で送信元 IP が書き換わりエクスポーターの
# 判別ができなくなるのを避けるため。この場合 Logstash の Pod が動いているノード宛てにしか届かないので、
# マルチノードの場合はルーターの送信先ノードを固定するため nodeSelector を設定すること。
apiVersion: apps/v1
kind: Deployment
metadata:
  name: elastiflow-logstash
  labels:
    app.kubernetes.io/name: elastiflow-logstash
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: elastiflow-logstash
  template:
    metadata:
      labels:
        app.kubernetes.io/name: elastiflow-logstash
    spec:
      # nodeSelector:
      #   kubernetes.io/hostname: <flow を受けるノード名>
      containers:
        - name: elastiflow-logstash
          image: ghcr.io/hika019/elastiflow-logstash:9.2.1
          imagePullPolicy: Always
          env:
            # JVM Heap size - this MUST be at least 3GB (4GB preferred)
            - name: LS_JAVA_OPTS
              value: -Xms512m -Xmx2g

            # ElastiFlow global configuration
            - name: ELASTIFLOW_AGENT_ID
              value: elastiflow
            - name: ELASTIFLOW_GEOIP_CACHE_SIZE
              value: "16384"
            - name: ELASTIFLOW_GEOIP_LOOKUP
              value: "true"
            - name: ELASTIFLOW_ASN_LOOKUP
              value: "true"
            - name: ELASTIFLOW_OUI_LOOKUP
              value: "false"
            - name: ELASTIFLOW_POPULATE_LOGS
              value: "true"
            - name: ELASTIFLOW_KEEP_ORIG_DATA
              value: "true"
            - name: ELASTIFLOW_DEFAULT_APPID_SRCTYPE
              value: __UNKNOWN

            # Name resolution option
            - name: ELASTIFLOW_RESOLVE_IP2HOST
              value: "false"
            - name: ELASTIFLOW_NAMESERVER
              value: 127.0.0.1
            - name: ELASTIFLOW_DNS_HIT_CACHE_SIZE
              value: "25000"
            - name: ELASTIFLOW_DNS_HIT_CACHE_TTL
              value: "900"
            - name: ELASTIFLOW_DNS_FAILED_CACHE_SIZE
              value: "75000"
            - name: ELASTIFLOW_DNS_FAILED_CACHE_TTL
              value: "3600"

            - name: ELASTIFLOW_ES_HOST
              value: elastiflow-elasticsearch:9200

            - name: ELASTIFLOW_NETFLOW_IPV4_PORT
              value: "2055"
            - name: ELASTIFLOW_NETFLOW_UDP_WORKERS
              value: "2"
            - name: ELASTIFLOW_NETFLOW_UDP_QUEUE_SIZE
              value: "4096"
            - name: ELASTIFLOW_NETFLOW_UDP_RCV_BUFF
              value: "33554432"

            - name: ELASTIFLOW_SFLOW_IPV4_PORT
              value: "6343"
            - name: ELASTIFLOW_SFLOW_UDP_WORKERS
              value: "2"
            - name: ELASTIFLOW_SFLOW_UDP_QUEUE_SIZE
              value: "4096"
            - name: ELASTIFLOW_SFLOW_UDP_RCV_BUFF
              value: "33554432"

            - name: ELASTIFLOW_IPFIX_UDP_IPV4_PORT
              value: "4739"
            - name: ELASTIFLOW_IPFIX_UDP_WORKERS
              value: "2"
            - name: ELASTIFLOW_IPFIX_UDP_QUEUE_SIZE
              value: "4096"
            - name: ELASTIFLOW_IPFIX_UDP_RCV_BUFF
              value: "33554432"
          ports:
            - name: netflow
              containerPort: 2055
              protocol: UDP
            - name: sflow
              containerPort: 6343
              protocol: UDP
            - name: ipfix
              containerPort: 4739
              protocol: UDP
---
apiVersion: v1
kind: Service
metadata:
  name: elastiflow-logstash
  labels:
    app.kubernetes.io/name: elastiflow-logstash
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  type: NodePort
  externalTrafficPolicy: Local
  selector:
    app.kubernetes.io/name: elastiflow-logstash
  ports:
    - name: netflow
      port: 2055
      targetPort: netflow
      nodePort: 32055
      protocol: UDP
    - name: sflow
      port: 6343
      targetPort: sflow
      nodePort: 32343
      protocol: UDP
    - name: ipfix
      port: 4739
      targetPort: ipfix
      nodePort: 32739
      protocol: UDP
